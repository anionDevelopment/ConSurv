# This file declares the findings of the OCI-image-secret-scan which are known false positives and therefore get ignored. That
# scan is implemented by ScriptCollection itself and is performed by "scsearchforsecrets" (and by "scbuildcodeunits") in addition
# to the repository-scan, because a secret which is part of a published image is readable by everybody who is allowed to pull it.
# Every regex below is matched against the finding-description, which names the path a file has inside the image as well as the
# kind of the finding. An entry is therefore scoped to exactly one kind of finding in one file instead of hiding everything the
# image contains at that path. The path inside the image differs from the repository-path because the containerfile copies the
# files to other locations.
# The findings of the repository-scan are declared in "<repository>/.betterleaks.toml" instead, because that scan is performed by
# the third-party-tool betterleaks, which has its own configuration-file.

[[ignoredfindings]]
description = "Development-only certificate inside the built OCI-image. The containerfile copies it from 'Other/Resources/DevelopmentCertificate/' to '/Workspace/Other/Certificates/' where nginx uses it as default-certificate. It is a self-signed certificate for the local test-domain 'consurv.test.local' issued by a local development-CA and is expected to get replaced for a real deployment."
regexes = [
    '''Workspace/Other/Certificates/ConSurvDevelopmentCertificate\.''',
]

[[ignoredfindings]]
description = "Compiler-generated XML-documentation of the backend inside the built OCI-image. The reported url is the example 'rtsp://user:pass@host/path' of a documentation-comment which describes how the user-info-segment gets removed from a camera-url; it is not a real credential."
regexes = [
    '''Workspace/Application/Backend/ConSurvBackend\.xml" in image-layer: contains credentials in the url''',
]

[[ignoredfindings]]
description = "Documentation-comments of the MediaMTX-default-configuration inside the built OCI-image. 'ConSurvBackend/Other/Resources/MediaMTX_*' is a downloaded third-party-artifact (git-ignored, therefore not covered by the repository-scan) and the containerfile copies it to '/Workspace/Application/Backend/MediaMTX/'. The reported urls are the placeholder-examples 'rtsp://user:pass@host:port/path' etc. of the comment which lists the supported source-url-formats; 'user' and 'pass' are placeholders and not real credentials."
regexes = [
    '''Workspace/Application/Backend/MediaMTX/mediamtx\.yml" in image-layer: contains credentials in the url''',
]
